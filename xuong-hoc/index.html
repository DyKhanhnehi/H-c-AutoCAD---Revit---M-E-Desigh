<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2028">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xưởng học">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Xưởng học CAD BIM M&amp;E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning tool for a working electrical engineer: practical, exact
   IDEA a CAD drawing set: dark model-space screen on top, white paper sheets with title blocks below
   PICTURE ceiling-void coordination section drawn in CAD layer colours; in lessons the CAD command-line lab is the picture
   COLOUR model-space charcoal, white paper, one layer colour per course: AutoCAD red, Revit blue, M&E amber; cyan for live input
   TYPE Be Vietnam Pro 800 + Be Vietnam Pro, JetBrains Mono for commands
   LAYOUT laptop: title row, full-width section drawing, three sheets in a row; phone: everything stacks, title then drawing then cards */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1217);--ink:light-dark(#121820,#e6ebf1);--mut:light-dark(#566170,#9ba7b5);--line:light-dark(#dde3ea,#28313c);--panel:light-dark(#f3f5f8,#151b22);--ms:#1a2028;--msink:#e6ebf1;--cad:light-dark(#d32f27,#ff6a5f);--rvt:light-dark(#2459c9,#6f9ef5);--me:light-dark(#a86a00,#f2b33a);--ok:light-dark(#11804a,#45d08a);--bad:light-dark(#c42c25,#ff7a70);--cy:#4fd1ff;--cy2:light-dark(#0a7799,#4fd1ff)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,50px);font-weight:800}
h2{font-size:clamp(24px,3vw,32px);font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0 0 12px}
code,kbd,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
code{background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:.9em;overflow-wrap:anywhere}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.mut{color:var(--mut)}
.band{padding-block:clamp(24px,4vw,56px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.scroll,pre{overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--ms);color:var(--msink);border-bottom:1px solid #2c3540}
.top .wrap{display:flex;align-items:center;gap:12px 20px;padding:6px max(5vw,16px,env(safe-area-inset-right,0px)) 6px max(5vw,16px,env(safe-area-inset-left,0px));max-width:none}
.brand{font-weight:800;text-decoration:none;white-space:nowrap;display:flex;gap:8px;align-items:center;font-size:17px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav a{flex:none;text-decoration:none;padding:0 14px;border-radius:8px;color:#b8c3cf;font-weight:500;min-height:44px;display:flex;align-items:center}
.nav a:hover{color:#fff}
.nav a.on{background:#2a333e;color:#fff}
@media(max-width:640px){.top .wrap{flex-direction:column;align-items:stretch;gap:0}.brand{min-height:40px}}
.btn{font:inherit;font-weight:600;min-height:44px;padding:9px 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--panel)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.88}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.txt,select{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.txt:focus{border-color:var(--cy2)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--cy2));border-radius:4px;transition:width .4s}
.hero{background:var(--ms);color:var(--msink)}
.hero .head{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:end;justify-content:space-between}
.hero .head p{color:#aeb9c6;max-width:62ch;margin:14px 0 0}
.tot{display:flex;gap:14px;align-items:baseline}
.tot b{font-size:clamp(40px,6vw,64px);font-weight:800;line-height:1;letter-spacing:-.03em}
.tot span{color:#aeb9c6;font-size:14px;max-width:12em;line-height:1.3}
.sec{position:relative;height:clamp(240px,30vw,320px);margin-top:28px;border:1px solid #2c3540;border-radius:10px;overflow:hidden;background:#161b22}
.sec svg{position:absolute;inset:0;width:100%;height:100%}
.sec text{font:500 13px "Be Vietnam Pro",sans-serif;fill:#dfe6ee;paint-order:stroke;stroke:#161b22;stroke-width:4px}
.cap{color:#93a1b0;font-size:14px;margin:10px 0 0}
.dr{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 1.8s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.dr{animation:none;stroke-dashoffset:0}.bar i{transition:none}}
.cont{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:6px;padding:14px 18px;margin-bottom:24px}
.cont small{display:block;color:var(--mut);font-size:13px}
.cont b{font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.sheet{border:1.5px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;background:var(--bg)}
.sheet .art{height:150px;background:var(--panel);border-bottom:1.5px solid var(--ink);color:var(--tc);display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%}
.tb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1}
.tb .c{padding:10px 14px;border-bottom:1px solid var(--line)}
.tb .c:nth-child(odd):not(.w){border-right:1px solid var(--line)}
.tb .w{grid-column:1/-1}
.tb .lb{display:block;font-size:13px;color:var(--mut)}
.tb .nm b{font-size:24px;font-weight:800;color:var(--tc)}
.tb .big{font-size:24px;font-weight:800}
.tb .acts{display:flex;gap:10px;flex-wrap:wrap;border-bottom:0;margin-top:auto}
.path{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0 32px}
.path li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.path .wk{font-weight:800;font-size:18px;white-space:nowrap}
.path b{display:block}
.path span{color:var(--mut);font-size:15px}
.alt{background:var(--panel)}
.thead{background:color-mix(in srgb,var(--tc) 13%,var(--bg))}
.th{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 40px}
.th h1{color:var(--tc)}
.th p{margin:10px 0 0;max-width:60ch}
.prog{min-width:220px;flex:0 1 300px}
.prog b{font-size:32px;font-weight:800}
.prog span{color:var(--mut);margin-left:8px}
.seg{display:flex;gap:6px;margin-top:24px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:72px;border:1px solid var(--line);border-radius:8px;padding:6px;max-height:calc(100vh - 92px);overflow:auto}
.toc h4{font-size:13px;color:var(--mut);margin:12px 10px 2px;font-weight:600}
.toc button{display:flex;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;border:0;background:none;font:inherit;font-size:15px;color:inherit;min-height:44px;cursor:pointer;align-items:center}
.toc button:hover{background:var(--panel)}
.toc button.on{background:var(--panel);font-weight:600}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:11px}
.dot.ok{background:var(--tc);border-color:var(--tc)}
.lsel{display:none;margin-bottom:20px}
.lsel select{width:100%}
@media(max-width:860px){.learn{grid-template-columns:minmax(0,1fr)}.toc{display:none}.lsel{display:block}}
.les{max-width:74ch}
.les .mod{color:var(--tc);font-weight:600;font-size:14px;margin-bottom:8px}
.les h2{margin-bottom:18px}
.les ul{padding-left:1.2em;margin:0 0 14px}
.les li{margin-bottom:6px}
.f{font:600 17px/1.5 "JetBrains Mono",monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 14px;overflow-x:auto}
.do{border:1.5px dashed var(--tc);border-radius:8px;padding:12px 16px;margin:18px 0}
.do b{color:var(--tc)}
table.keys{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:15px}
.keys th,.keys td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.keys th{font-size:13px;color:var(--mut);font-weight:600}
.keys td:first-child{white-space:nowrap;font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--tc)}
.lnav{margin-top:26px;justify-content:space-between}
.lab{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}}
.exl{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.chip{font:inherit;font-size:15px;min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);font-weight:600}
.chip .ck{color:var(--ok);font-weight:800}
.excard{border:1px solid var(--line);border-radius:8px;padding:16px}
.excard h3{margin-bottom:8px}
.hint{font:14px/1.6 "JetBrains Mono",monospace;background:var(--panel);padding:10px 12px;border-radius:6px;margin:10px 0 0;overflow-wrap:anywhere}
.exst{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--panel);font-size:15px}
.exst.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--ink);font-weight:600}
.cad{background:var(--ms);border-radius:10px;overflow:hidden;color:#dfe6ee;border:1px solid #2c3540}
.cadtool{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px 6px 14px;border-bottom:1px solid #2c3540;font-size:14px;color:#9fb0c2}
.zb{font:inherit;font-size:14px;min-height:40px;padding:0 12px;border-radius:6px;border:1px solid #3a4552;background:#222a34;color:#dfe6ee;cursor:pointer}
.zb:hover{background:#2c3643}
.cvbox{position:relative;height:clamp(320px,52vh,520px)}
.cvbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
.cadbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:6px 14px;font:13px "JetBrains Mono",monospace;color:#9fb0c2;border-top:1px solid #2c3540}
.log{font:13px/1.55 "JetBrains Mono",monospace;padding:8px 14px;min-height:6.4em;color:#aab7c5;border-top:1px solid #2c3540;white-space:pre-wrap;overflow-wrap:anywhere}
.cmdline{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid #2c3540;background:#131820}
.cmdline:focus-within{box-shadow:inset 0 0 0 2px var(--cy)}
.cmdline label{font:600 14px "JetBrains Mono",monospace;color:var(--cy);max-width:60%;flex:none}
.cmdline input{flex:1;background:transparent;border:0;color:#fff;font:16px "JetBrains Mono",monospace;min-height:44px;text-transform:uppercase;outline:none}
.kt{margin-top:40px;border-top:1.5px solid var(--ink);padding-top:24px}
.kthead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.ktname{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin:16px 0 14px;letter-spacing:-.02em}
.kt form .txt{width:14em;text-transform:uppercase;font-family:"JetBrains Mono",monospace}
.ktr{min-height:1.6em;margin-top:10px;font-weight:600}
.ok-t{color:var(--ok)}
.bad-t{color:var(--bad)}
details{margin-top:18px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.olist{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px;max-width:760px}
.olist li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;background:var(--bg)}
.olist li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.olist li.bad{border-color:var(--bad)}
.olist .n{font-weight:800;color:var(--tc)}
.olist .mv{display:flex;gap:4px}
.olist .mv button{font:inherit;font-size:18px;width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.olist .mv button:disabled{opacity:.35;cursor:default}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.exbox{border:1.5px solid var(--ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exh .tick{font-size:13px;color:var(--ok);font-weight:600;white-space:nowrap}
.exbox p{margin:0;font-size:15px}
.inps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.inps label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.inps .iu{display:flex;align-items:center;gap:6px}
.inps .txt{width:100%}
.inps em{font-style:normal;font-size:13px;white-space:nowrap;color:var(--mut)}
.ans{border-top:1px solid var(--line);padding-top:12px}
.ans label{font-weight:600}
.ans .txt{width:9em}
.unit{white-space:nowrap;font-weight:600}
.out{font-size:15px;line-height:1.6}
.out:empty{display:none}
.out .sol{background:var(--panel);border-radius:6px;padding:10px 12px;margin-top:6px;font-family:"JetBrains Mono",monospace;font-size:14px;overflow-wrap:anywhere}
.qz{max-width:760px}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.qq{font-size:clamp(20px,2.4vw,24px);margin:18px 0 16px;line-height:1.3}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg));font-weight:600}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.qex{margin:14px 0;min-height:1.5em}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
@media(max-width:900px){.rv{grid-template-columns:minmax(0,1fr)}}
.fc{margin:16px 0 12px;width:100%;min-height:220px;border:1.5px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.fc.back{background:var(--ms);color:var(--msink);border-color:var(--ms)}
.fc small{font-size:13px;color:var(--mut)}
.fc.back small{color:#9fb0c2}
.fc .ft{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.25}
.fc.back .ft{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--cy)}
.foot{color:var(--mut);font-size:14px;border-top:1px solid var(--line);padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
@media(max-width:600px){table{font-size:14px}.keys th,.keys td{padding:6px 4px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 1v20M1 11h20" stroke="#4fd1ff" stroke-width="1.6"/><rect x="7" y="7" width="8" height="8" fill="none" stroke="#fff" stroke-width="1.6"/></svg>Xưởng học CAD · BIM · M&amp;E</a>
  <nav class="nav" aria-label="Chuyên mục"><a href="#home">Trang chủ</a><a href="#autocad">AutoCAD</a><a href="#revit">Revit</a><a href="#me">M&amp;E</a><a href="#on-tap">Ôn tập</a></nav>
</div></header>
<main id="app"></main>
<footer class="band foot"><div class="wrap">Tiến độ được lưu trong trình duyệt của máy này. Công thức và giá trị tham khảo dùng để học; khi thiết kế thật hãy đối chiếu tiêu chuẩn hiện hành, catalog nhà sản xuất và yêu cầu của dự án.</div></footer>
<script>
{
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(n,d=2)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});
const num=s=>{s=String(s).trim().replace(/\s/g,'');if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');return s===''?NaN:+s};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const KEY='xuong-hoc-bim-v1';
let st={done:{},quiz:{},ex:{},les:{},tab:{},cadEx:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')st={...st,...s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

/* ---------- Nội dung bài học ---------- */
const TR={
autocad:{name:'AutoCAD',c:'var(--cad)',sub:'Vẽ 2D kỹ thuật: dòng lệnh, tọa độ, bắt điểm, layer, block, xref và in ấn bản vẽ M&E.',mods:[
{t:'Nền tảng',ls:[
{t:'Giao diện và dòng lệnh',b:`<p>AutoCAD làm việc theo kiểu <b>gõ lệnh, trả lời câu hỏi</b>. Mọi nút trên Ribbon đều ứng với một lệnh hiện ở dòng Command. Thói quen của người vẽ nhanh: tay trái gõ tắt lệnh, tay phải dùng chuột chọn điểm.</p><ul><li><b>Model space</b>: nơi vẽ theo tỉ lệ 1:1, đúng kích thước thật (bản vẽ M&amp;E thường dùng đơn vị mm).</li><li><b>Layout (paper space)</b>: nơi dàn trang, đặt khung tên, viewport và in.</li><li><b>Thanh trạng thái</b>: bật tắt các chế độ trợ giúp vẽ bên dưới.</li></ul>`,k:[['Enter / Space','Kết thúc lệnh, hoặc lặp lại lệnh vừa dùng'],['Esc','Hủy lệnh đang chạy'],['F3','OSNAP: bắt điểm đối tượng'],['F8','ORTHO: chỉ vẽ ngang, dọc'],['F10','POLAR: bắt theo góc'],['F11','OTRACK: dóng theo điểm bắt'],['F12','Dynamic Input'],['Ctrl+Z','Hoàn tác'],['Ctrl+1','Bảng Properties']],d:'Mở AutoCAD, bật/tắt lần lượt F3, F8, F12 và quan sát thanh trạng thái thay đổi.'},
{t:'Hệ tọa độ',b:`<p>Ba cách nhập điểm cần thuộc lòng:</p><ul><li><b>Tuyệt đối</b> <code>x,y</code>: tính từ gốc 0,0. Ví dụ <code>100,50</code>.</li><li><b>Tương đối</b> <code>@dx,dy</code>: tính từ điểm vừa nhập. <code>@120,0</code> là đi sang phải 120.</li><li><b>Cực</b> <code>@d&lt;góc</code>: đi một khoảng d theo một góc. Góc 0° hướng sang phải, tăng ngược chiều kim đồng hồ: 90° lên trên, 180° sang trái, 270° xuống dưới.</li></ul><p>Khi bật Dynamic Input (F12), điểm thứ hai mặc định là tương đối; gõ <code>#x,y</code> để ép tuyệt đối. Trong phòng vẽ mô phỏng của app, Dynamic Input tắt nên bạn gõ đầy đủ ký hiệu <code>@</code>.</p>`,d:'Làm bài 1, 2 và 4 trong tab Thực hành để dùng cả ba kiểu tọa độ.'},
{t:'Bắt điểm và đơn vị',b:`<p>Bản vẽ chính xác nhờ bắt điểm, không nhờ nhìn cho trùng. Gõ <code>OS</code> để chọn các chế độ bắt điểm thường trực; giữ Shift và bấm chuột phải để chọn một chế độ chỉ dùng một lần.</p><p>Đơn vị: gõ <code>UNITS</code>, đặt Insertion scale là Millimeters. Vẽ 1 đơn vị bằng 1 mm, nhờ đó block và xref chèn vào đúng tỉ lệ.</p>`,k:[['END','Endpoint: điểm cuối'],['MID','Midpoint: trung điểm'],['CEN','Center: tâm cung, đường tròn'],['INT','Intersection: giao điểm'],['PER','Perpendicular: chân đường vuông góc'],['NEA','Nearest: điểm gần nhất trên đối tượng'],['QUA','Quadrant: điểm góc phần tư đường tròn'],['TAN','Tangent: tiếp điểm']]}
]},
{t:'Vẽ và hiệu chỉnh',ls:[
{t:'Lệnh vẽ cơ bản',b:`<p>Mỗi lệnh hỏi lần lượt từng thông số. Đọc dòng Command: phần trong ngoặc vuông là tùy chọn, gõ chữ in hoa của tùy chọn để chọn. Ví dụ khi vẽ đường tròn, gõ <code>D</code> để nhập đường kính thay vì bán kính.</p><p>Với bản vẽ M&amp;E, nên dùng <b>PL</b> cho tuyến cáp, tuyến ống: một polyline là một đối tượng nên đo chiều dài nhanh bằng Properties hoặc lệnh <code>LIST</code>.</p>`,k:[['L','Line: đoạn thẳng nối tiếp'],['PL','Polyline: đa tuyến, một đối tượng'],['C','Circle: đường tròn'],['A','Arc: cung tròn'],['REC','Rectangle: hình chữ nhật'],['POL','Polygon: đa giác đều'],['EL','Ellipse'],['H','Hatch: tô mặt cắt vật liệu'],['SPL','Spline: đường cong trơn']]},
{t:'Lệnh hiệu chỉnh',b:`<p>Phần lớn lệnh hiệu chỉnh theo trình tự: <b>chọn đối tượng, Enter, điểm gốc, điểm đích</b>. Từ AutoCAD 2021, TRIM và EXTEND mặc định chế độ Quick: không cần chọn cạnh cắt, chỉ việc quét qua phần cần cắt.</p><p><b>OFFSET</b> là lệnh dùng nhiều nhất khi vẽ M&amp;E: vẽ tim ống gió rồi offset hai bên để ra ống hai nét, offset tường để ra tuyến máng cáp cách tường 300.</p>`,k:[['M','Move: di chuyển'],['CO / CP','Copy: sao chép'],['RO','Rotate: xoay'],['MI','Mirror: đối xứng'],['O','Offset: tạo đường song song'],['TR','Trim: cắt'],['EX','Extend: kéo dài'],['F','Fillet: bo góc; R = 0 để nối thành góc vuông'],['SC','Scale: thu phóng'],['AR','Array: sao chép theo dãy'],['S','Stretch: kéo giãn'],['X','Explode: phá khối'],['J','Join: nối đối tượng'],['BR','Break: bẻ gãy']],d:'Vẽ một tuyến ống gió chữ L: vẽ tim bằng PL, OFFSET 200 hai bên, FILLET R = 0 ở góc.'}
]},
{t:'Quản lý bản vẽ',ls:[
{t:'Layer và thuộc tính',b:`<p>Layer là tấm kính chứa nhóm đối tượng cùng loại. Quy ước tốt là đặt tên theo bộ môn và hệ thống, ví dụ <code>E-LIGHT</code> (chiếu sáng), <code>E-POWER</code> (động lực), <code>E-TRAY</code> (máng cáp), <code>M-DUCT-SA</code> (gió cấp), <code>P-CW</code> (nước lạnh).</p><ul><li>Màu, kiểu đường, độ dày nét đặt ở layer; thuộc tính của đối tượng để <b>ByLayer</b>.</li><li><b>Freeze</b> ẩn hẳn và không tính khi tái tạo bản vẽ; <b>Off</b> chỉ ẩn hiển thị; <b>Lock</b> khóa không cho sửa.</li></ul>`,k:[['LA','Layer Properties Manager'],['LAYISO','Cô lập layer của đối tượng chọn'],['LAYUNISO','Bỏ cô lập'],['LAYOFF','Tắt layer của đối tượng chọn'],['MA','Match Properties: sao thuộc tính']]},
{t:'Block và thuộc tính',b:`<p>Block gom nhiều đối tượng thành một ký hiệu dùng lại: ổ cắm, công tắc, đèn, tủ điện. Vẽ nội dung block trên layer 0 để khi chèn nó nhận màu của layer đích.</p><p>Thêm thuộc tính bằng <code>ATTDEF</code> (mã tủ, công suất, số mạch), sau đó thống kê số lượng bằng <code>DATAEXTRACTION</code>. Dynamic block cho phép kéo giãn, lật, chọn kiểu ngay trên bản vẽ.</p>`,k:[['B','Tạo block'],['I','Insert: chèn block'],['W','WBLOCK: ghi block ra file riêng'],['ATT','ATTDEF: định nghĩa thuộc tính'],['BEDIT','Sửa block'],['DATAEXTRACTION','Xuất bảng thống kê']],d:'Tạo block ổ cắm đôi có thuộc tính MACH (số mạch), chèn 10 cái rồi thống kê bằng DATAEXTRACTION.'},
{t:'Xref: nền kiến trúc',b:`<p>Kỹ sư M&amp;E không vẽ đè lên file kiến trúc: dùng <code>XR</code> gắn nền kiến trúc vào file của mình. Khi kiến trúc cập nhật, chỉ cần Reload.</p><ul><li><b>Attach</b>: xref đi theo khi file của bạn được người khác xref tiếp. <b>Overlay</b>: không đi theo, tránh lồng vòng.</li><li>Dùng đường dẫn tương đối khi gửi hồ sơ, đóng gói bằng <code>ETRANSMIT</code>.</li><li>Làm mờ nền bằng Xref fading hoặc đổi màu layer nền sang màu 8, 9.</li></ul>`,k:[['XR','Bảng External References'],['XA','XATTACH: gắn xref'],['XCLIP','Cắt vùng hiển thị xref'],['ETRANSMIT','Đóng gói bản vẽ và file liên kết']]}
]},
{t:'Ghi chú và in',ls:[
{t:'Chữ và kích thước',b:`<p>Dùng text style và dim style thống nhất cho cả bộ hồ sơ. Bật <b>Annotative</b> để chữ, kích thước, ghi chú tự đúng chiều cao khi in ở mọi tỉ lệ viewport (ví dụ chữ cao 2,5 mm trên giấy dù viewport 1:50 hay 1:100).</p>`,k:[['MT','MText: chữ nhiều dòng'],['DT','Text một dòng'],['DLI','DimLinear: kích thước ngang, dọc'],['DAL','DimAligned: kích thước xiên'],['DRA','DimRadius: bán kính'],['DCO','DimContinue: kích thước nối tiếp'],['D','DimStyle: kiểu kích thước'],['ST','Text style'],['MLD','MLeader: ghi chú có mũi tên']]},
{t:'Layout, viewport và in',b:`<p>Trong Layout, chèn khung tên tỉ lệ 1:1 (A1 = 841 × 594 mm, A3 = 420 × 297 mm), tạo viewport bằng <code>MV</code>, đặt tỉ lệ viewport (1:50, 1:100) rồi khóa viewport.</p><p>In bằng <code>PLOT</code> (Ctrl+P) với bảng nét in <b>.ctb</b> (nét theo màu) hoặc .stb (nét theo kiểu). Dùng Page Setup Manager để mọi layout in giống nhau; xuất PDF bằng máy in DWG To PDF.</p>`,k:[['MV','MView: tạo viewport'],['PLOT / Ctrl+P','In bản vẽ'],['PAGESETUP','Quản lý thiết lập trang'],['LTS','LTSCALE: tỉ lệ kiểu đường']],d:'Dàn một mặt bằng điện lên layout A3 tỉ lệ 1:100 và xuất PDF đen trắng bằng monochrome.ctb.'}
]}]},

revit:{name:'Revit',c:'var(--rvt)',sub:'Mô hình BIM: family, view, level, dựng kiến trúc cơ bản và Revit MEP cho điện, HVAC, nước, phối hợp va chạm.',mods:[
{t:'Tư duy BIM',ls:[
{t:'Revit khác AutoCAD thế nào',b:`<p>Revit không vẽ đường nét mà dựng <b>đối tượng có thông tin</b>: tường, ống gió, tủ điện. Mặt bằng, mặt cắt, 3D, bảng thống kê đều là các <b>view</b> nhìn vào cùng một mô hình; sửa ở đâu cũng cập nhật mọi nơi.</p><ul><li><b>Project</b> (.rvt): chứa toàn bộ dự án.</li><li><b>Family</b> (.rfa): thư viện đối tượng có tham số.</li><li><b>Template</b> (.rte): thiết lập ban đầu như đơn vị, view, kiểu ống, tag.</li></ul>`},
{t:'Category, Family, Type, Instance',b:`<p>Ví dụ: Category <i>Lighting Fixtures</i>, Family "Đèn panel âm trần", Type "600×600 40W", Instance là từng bộ đèn đặt trong phòng.</p><ul><li><b>Instance Properties</b> (bảng Properties) chỉ áp cho đối tượng đang chọn. <b>Type Properties</b> (Edit Type) áp cho mọi đối tượng cùng type, nên sửa cẩn thận.</li><li><b>System family</b> có sẵn trong dự án, không load từ file: Wall, Floor, Duct, Pipe, Cable Tray, Conduit.</li><li><b>Loadable family</b> (.rfa): đèn, ổ cắm, tủ điện, FCU, van.</li><li><b>In-place family</b>: dựng tại chỗ cho một đối tượng đặc biệt; hạn chế dùng.</li></ul>`},
{t:'View và hiển thị',b:`<p><b>Visibility/Graphics</b> bật tắt theo category và filter. <b>View Range</b> quyết định mặt bằng cắt ở cao độ nào và nhìn xuống tới đâu; ống đi cao trên mặt cắt sẽ không hiện nếu Top của View Range thấp hơn nó. <b>Detail Level</b>: ở Coarse ống, máng cáp chỉ hiện một nét; ở Medium hoặc Fine mới hiện hai nét. Dùng <b>View Template</b> để áp chuẩn hiển thị cho nhiều view.</p>`,k:[['VG / VV','Visibility/Graphics'],['PP','Bật bảng Properties'],['TL','Thin Lines'],['HH','Ẩn tạm thời'],['HI','Cô lập tạm thời'],['HR','Bỏ ẩn hoặc cô lập tạm thời'],['EH','Ẩn đối tượng trong view'],['ZF','Zoom to fit'],['WF / HL / SD','Wireframe, Hidden Line, Shaded']]}
]},
{t:'Mô hình cơ bản',ls:[
{t:'Level và Grid',b:`<p>Luôn tạo <b>Level</b> trước (trong view Elevation) rồi <b>Grid</b> (trong mặt bằng). Mọi đối tượng bám theo level; đổi cao độ level thì cả tầng đi theo. Đặt tên rõ ràng, ví dụ "L01 +0.000", "L02 +4.200".</p><p>Khi làm MEP, không tự vẽ level, grid mà dùng <b>Copy/Monitor</b> từ mô hình kiến trúc để luôn khớp và được cảnh báo khi kiến trúc thay đổi.</p>`,k:[['LL','Level'],['GR','Grid'],['RP','Reference Plane'],['DI','Aligned Dimension']],d:'Tạo dự án mới, dựng 3 level cách nhau 4,2 m và lưới trục 4 × 3 nhịp 8 m.'},
{t:'Tường, cửa, sàn và hiệu chỉnh',b:`<p>Tường có Base Constraint và Top Constraint bám level. <b>Align</b> là lệnh mạnh nhất: căn thẳng đối tượng rồi bấm ổ khóa để giữ ràng buộc. <b>Pin</b> cố định grid, level, mô hình link để tránh lỡ tay kéo lệch.</p>`,k:[['WA','Wall'],['DR','Door'],['WN','Window'],['CM','Place Component'],['RM','Room'],['AL','Align'],['MV','Move'],['CO / CC','Copy'],['RO','Rotate'],['MM','Mirror, chọn trục'],['TR','Trim/Extend to Corner'],['SL','Split Element'],['OF','Offset'],['PN','Pin'],['MA','Match Type Properties']]}
]},
{t:'Revit MEP',ls:[
{t:'Khởi tạo dự án MEP',b:`<p>Bắt đầu từ template Electrical, Mechanical hoặc Systems. Link mô hình kiến trúc (Insert &gt; Link Revit, Positioning: Origin to Origin hoặc Shared Coordinates) rồi Pin lại. Copy/Monitor level, grid. Tạo floor plan theo discipline.</p><ul><li><b>Electrical Settings</b>: Voltage Definitions và Distribution Systems (ví dụ 3 pha 4 dây 380/220 V hoặc 400/230 V tùy dự án).</li><li><b>Mechanical Settings</b>: kích thước ống gió, ống nước, phương pháp tính tổn thất.</li></ul>`},
{t:'Hệ thống điện',b:`<p>Trình tự: đặt tủ điện và gán Distribution System cho tủ; đặt đèn, ổ cắm, thiết bị có connector điện; chọn thiết bị, tạo <b>Power circuit</b>, <b>Select Panel</b>; có thể vẽ dây Arc Wire; cuối cùng tạo <b>Panel Schedule</b>. Máng cáp và ống luồn vẽ như ống: chọn type, nhập rộng × cao hoặc đường kính và Offset (cao độ đặt).</p><p>Revit không thay cho tính toán chọn cáp, sụt áp, ngắn mạch theo tiêu chuẩn; hãy kiểm tra lại bằng tính tay (tab M&amp;E) hoặc phần mềm chuyên dụng.</p>`,k:[['EE','Electrical Equipment: tủ điện'],['LF','Lighting Fixture: đèn'],['EW','Arc Wire: dây điện'],['CT','Cable Tray: máng cáp'],['CN','Conduit: ống luồn'],['TG','Tag by Category']],d:'Đặt 1 tủ DB và 12 đèn trong một phòng, chia 2 mạch, tạo Panel Schedule.'},
{t:'HVAC và cấp thoát nước',b:`<p><b>HVAC</b>: tạo Space trùng Room kiến trúc, gom Zone, chạy Heating and Cooling Loads để có tải sơ bộ. Đặt thiết bị (FCU, AHU, quạt) và miệng gió, vẽ ống gió, tạo System rồi Duct Sizing theo vận tốc hoặc ma sát.</p><p><b>Ống nước</b>: chọn Pipe Type và System Type (nước lạnh, thoát nước thải...), đặt độ dốc cho ống thoát tự chảy.</p>`,k:[['DT','Duct: ống gió'],['PI','Pipe: ống nước'],['AT','Air Terminal: miệng gió'],['ME','Mechanical Equipment'],['PX','Plumbing Fixture: thiết bị vệ sinh']]},
{t:'Phối hợp và va chạm',b:`<p><b>Collaborate &gt; Interference Check</b>: chọn category (Ducts, Pipes, Cable Trays, Structural Framing) giữa mô hình của bạn và mô hình link, nhận danh sách va chạm, xuất báo cáo HTML. Kiểm tra tổng thể nhiều bộ môn thường làm trong Navisworks Clash Detective.</p><p>Quy tắc nhường tuyến thường gặp: ống thoát nước tự chảy và ống gió lớn giữ tuyến; ống áp lực và máng cáp nhường. Khi làm nhóm (worksharing), <b>Synchronize with Central</b> thường xuyên và Relinquish khi nghỉ.</p>`}
]},
{t:'Hồ sơ',ls:[
{t:'Tag, Schedule, Sheet',b:`<p><code>TG</code> gắn tag theo category. <b>Schedule</b> thống kê số lượng đèn, chiều dài ống, máng cáp và tự cập nhật khi mô hình đổi. Tạo Sheet, kéo view vào; mỗi view chỉ đặt trên một sheet (legend và schedule thì đặt được nhiều sheet). Xuất DWG/PDF từ File &gt; Export; khi xuất DWG cho đối tác dùng AutoCAD, thiết lập layer mapping cho khớp quy ước layer.</p>`,d:'Tạo schedule đèn theo phòng (Room: Name, Family and Type, Count) và đặt lên sheet cùng mặt bằng.'}
]}]},

me:{name:'M&E Design',c:'var(--me)',sub:'Nguyên lý thiết kế cơ điện: phụ tải, chọn CB và cáp, sụt áp, bù, chiếu sáng, nối đất, HVAC, cấp thoát nước, PCCC.',mods:[
{t:'Tổng quan',ls:[
{t:'Các hệ thống M&E',b:`<ul><li><b>Điện</b>: trung thế, trạm biến áp, tủ hạ thế MSB, tủ phân phối DB, động lực, chiếu sáng, ổ cắm, nối đất, chống sét, máy phát, UPS.</li><li><b>Điện nhẹ (ELV)</b>: mạng dữ liệu, camera, âm thanh, kiểm soát ra vào, báo cháy.</li><li><b>HVAC</b>: điều hòa (chiller, VRV/VRF, split), thông gió, hút khói, tăng áp cầu thang.</li><li><b>Cấp thoát nước</b>: cấp lạnh, nóng; thoát nước thải, nước mưa.</li><li><b>PCCC</b>: sprinkler, họng nước vách tường, chữa cháy khí.</li></ul><p>Trình tự hồ sơ: Thiết kế cơ sở, Thiết kế kỹ thuật, Bản vẽ thi công, Shop drawing (nhà thầu), Hoàn công (as-built).</p>`},
{t:'Tiêu chuẩn thường dùng',b:`<ul><li>QCVN 12:2014/BXD: hệ thống điện của nhà ở và nhà công cộng.</li><li>TCVN 9206:2012 đặt thiết bị điện; TCVN 9207:2012 đặt đường dẫn điện.</li><li>TCVN 9385:2012 chống sét cho công trình xây dựng.</li><li>TCVN 7114-1:2008 chiếu sáng nơi làm việc trong nhà.</li><li>TCVN 5687:2010 thông gió, điều hòa không khí.</li><li>QCVN 06:2022/BXD an toàn cháy cho nhà và công trình (kèm sửa đổi).</li><li>QCVN 09:2017/BXD sử dụng năng lượng hiệu quả.</li><li>IEC 60364: lắp đặt điện hạ áp.</li></ul><p>Luôn kiểm tra phiên bản hiện hành và yêu cầu riêng của chủ đầu tư, nhà máy trước khi áp dụng.</p>`}
]},
{t:'Điện',ls:[
{t:'Phụ tải và dòng điện',b:`<div class="f">1 pha: I = P / (U · cosφ)<br>3 pha: I = P / (√3 · U · cosφ)</div><p>Phụ tải tính toán: <b>P<sub>tt</sub> = K<sub>đt</sub> × Σ(K<sub>sd</sub> × P<sub>đm</sub>)</b>, với K<sub>sd</sub> là hệ số sử dụng, K<sub>đt</sub> là hệ số đồng thời. Công suất biểu kiến S = P / cosφ (kVA) dùng để chọn máy biến áp, máy phát.</p><p>Ví dụ: động cơ 22 kW, 400 V, cosφ 0,85: I = 22 000 / (1,732 × 400 × 0,85) ≈ 37,4 A. Với động cơ, chia thêm cho hiệu suất η để ra dòng thực tế.</p>`,d:'Làm dạng bài "Dòng điện tải 3 pha" trong tab Thực hành 3 lần liên tiếp đúng.'},
{t:'Chọn CB và cáp',b:`<div class="f">I<sub>B</sub> ≤ I<sub>n</sub> ≤ I<sub>Z</sub></div><p>Dòng làm việc ≤ dòng định mức CB ≤ khả năng mang dòng của cáp sau hiệu chỉnh (IEC 60364). I<sub>Z</sub> = I<sub>catalog</sub> × K<sub>nhiệt độ</sub> × K<sub>nhóm mạch</sub> × K<sub>cách lắp đặt</sub>.</p><ul><li>Kiểm tra thêm: sụt áp, khả năng cắt của CB (Icu ≥ dòng ngắn mạch tại điểm đặt), điều kiện ngắt bảo vệ chống điện giật.</li><li>Dây PE (cùng vật liệu dây pha, IEC 60364-5-54): S ≤ 16 mm² thì PE = S; 16 &lt; S ≤ 35 thì PE = 16; S &gt; 35 thì PE = S/2.</li></ul>`},
{t:'Sụt áp',b:`<div class="f">ΔU (3 pha) ≈ √3 · I · L · (R·cosφ + X·sinφ)</div><p>Với cáp tiết diện nhỏ có thể bỏ qua X: <b>ΔU ≈ √3 · I · L · ρ · cosφ / S</b>; ΔU% = ΔU / U × 100. Một pha dùng hệ số 2 thay cho √3 và U pha. ρ đồng ≈ 0,0225 Ω·mm²/m (ở nhiệt độ làm việc), nhôm ≈ 0,036.</p><p>Giới hạn tham khảo (IEC 60364-5-52): cấp từ lưới hạ áp công cộng 3% cho chiếu sáng, 5% cho thiết bị khác; cấp từ trạm riêng 6% và 8%.</p>`},
{t:'Bù công suất phản kháng',b:`<div class="f">Qc = P · (tanφ1 − tanφ2)</div><p>Ví dụ: P = 400 kW, nâng cosφ từ 0,75 lên 0,95: tanφ1 = 0,882; tanφ2 = 0,329; Qc ≈ 400 × 0,553 ≈ 221 kVAr. Chọn tủ bù theo bước tụ tiêu chuẩn, ví dụ 250 kVAr chia 5 cấp, điều khiển bằng bộ điều khiển hệ số công suất. Ngành điện thường yêu cầu cosφ ≥ 0,9 để không phải trả tiền công suất phản kháng.</p>`},
{t:'Chiếu sáng',b:`<div class="f">N = E · A / (Φ · UF · MF)</div><p>E là độ rọi yêu cầu (lx), A diện tích (m²), Φ quang thông một bộ đèn (lm), UF hệ số sử dụng (khoảng 0,5 đến 0,7 tùy phòng và đèn), MF hệ số duy trì (khoảng 0,8). Làm tròn lên rồi bố trí đều.</p><p>Độ rọi tham khảo theo TCVN 7114-1: văn phòng 500 lx, phòng điều khiển 500 lx, hành lang 100 lx, kho 100 lx, lắp ráp thô 200 lx, trung bình 300 lx, chính xác 500 lx. Kiểm tra lại bằng DIALux hoặc Relux.</p>`},
{t:'Nối đất và chống sét',b:`<p>Sơ đồ nối đất hạ áp: <b>TN-S</b> (N và PE tách riêng suốt hệ thống, phổ biến trong nhà máy và tòa nhà), TN-C, TN-C-S, TT, IT.</p><p>Điện trở nối đất lấy theo yêu cầu thiết kế và tiêu chuẩn áp dụng; nhiều dự án yêu cầu ≤ 4 Ω cho nối đất an toàn, ≤ 10 Ω cho chống sét. Chống sét theo TCVN 9385:2012: bộ phận thu sét, dây xuống, hệ tiếp địa; chống sét lan truyền bằng SPD lắp ở tủ điện theo vùng bảo vệ.</p>`}
]},
{t:'HVAC',ls:[
{t:'Tải lạnh, gió và nước lạnh',b:`<div class="f">1 RT = 12 000 BTU/h = 3,517 kW<br>Q (m³/h) = V phòng × ACH<br>A (m²) = Q / (3600 · v)<br>G (l/s) = Q (kW) / (4,186 · ΔT)</div><p>1 kW ≈ 3 412 BTU/h; máy lạnh dân dụng "1 HP" khoảng 9 000 BTU/h. ACH là số lần trao đổi gió mỗi giờ. Vận tốc tham khảo hệ ống gió áp thấp: ống chính 5 đến 8 m/s, ống nhánh 3 đến 5 m/s. Nước lạnh thường chạy 7/12 °C, tức ΔT = 5 K.</p>`,d:'Giải ba dạng bài HVAC trong tab Thực hành: đổi tải lạnh, tiết diện ống gió, lưu lượng nước lạnh.'}
]},
{t:'Nước và PCCC',ls:[
{t:'Cấp thoát nước và PCCC',b:`<div class="f">d = √(4Q / (π · v))</div><p>Vận tốc ống cấp nước khoảng 1 đến 2 m/s; ống nhánh trong nhà nên thấp hơn để giảm ồn. Ống thoát nước tự chảy cần độ dốc theo đường kính (thường 1 đến 3%), tra TCVN 4474 hoặc tiêu chuẩn của dự án.</p><p>PCCC: sprinkler (TCVN 7336), báo cháy (TCVN 5738), họng nước vách tường; bố trí theo QCVN 06:2022/BXD và hồ sơ thẩm duyệt. Phối hợp với điện: bơm chữa cháy, quạt tăng áp, hút khói lấy nguồn trước CB tổng hoặc từ nguồn ưu tiên, dùng cáp chống cháy.</p>`}
]}]}
};

/* ---------- Mặt cắt trần kỹ thuật (trang chủ) ---------- */
let animated=false;
function drawSec(svg){
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const n=W<560,an=animated?'':' class="dr"';
  const slab=26,ceil=H-48,bx=W*0.58,bw=Math.max(40,W*0.045),bb=slab+H*0.32;
  const dx=W*0.05,dw=Math.min(280,W*0.27),dy=slab+26,dh=Math.min(90,H*0.27);
  const tx=W*0.37,tw=Math.min(140,W*0.16),ty=slab+40,th=26;
  const r1=Math.min(16,W*0.024),r2=Math.min(12,W*0.018),p1x=W*0.72,p2x=W*0.72+r1+r2+18,py=bb+34;
  const lights=[0.17,0.47,0.83].map(f=>W*f);
  let s=`<defs><pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v8" stroke="#6c7988" stroke-width="1.2"/></pattern><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a" stop-opacity=".35"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></linearGradient></defs>`;
  for(let x=0;x<W;x+=40)s+=`<path d="M${x+.5} 0V${H}" stroke="#1f262f"/>`;
  for(let y=0;y<H;y+=40)s+=`<path d="M0 ${y+.5}H${W}" stroke="#1f262f"/>`;
  lights.forEach(x=>{s+=`<path d="M${x-22} ${ceil+12}L${x+22} ${ceil+12}L${x+70} ${H}L${x-70} ${H}Z" fill="url(#lg)"/>`});
  s+=`<rect x="-2" y="-2" width="${W+4}" height="${slab+2}" fill="url(#ht)" stroke="#c9d2dc" stroke-width="1.5"/>`;
  s+=`<rect x="${bx}" y="${slab}" width="${bw}" height="${bb-slab}" fill="url(#ht)" stroke="#c9d2dc" stroke-width="1.5"/>`;
  const rod=(x,y2)=>`<path d="M${x} ${slab}V${y2}" stroke="#7d8896" stroke-width="1.2"/>`;
  s+=rod(dx+14,dy-6)+rod(dx+dw-14,dy-6)+rod(tx+6,ty+th)+rod(tx+tw-6,ty+th)+rod(p1x,py-r1)+rod(p2x,py-r2);
  s+=`<rect x="${dx-6}" y="${dy-6}" width="${dw+12}" height="${dh+12}" fill="none" stroke="#4fd1ff" stroke-width="1" stroke-dasharray="6 4" opacity=".7"/>`;
  s+=`<rect${an} x="${dx}" y="${dy}" width="${dw}" height="${dh}" fill="rgba(79,209,255,.07)" stroke="#4fd1ff" stroke-width="2"/>`;
  s+=`<path d="M${dx} ${dy}L${dx+dw} ${dy+dh}M${dx+dw} ${dy}L${dx} ${dy+dh}" stroke="#4fd1ff" stroke-width="1" opacity=".55"/>`;
  s+=`<path${an} d="M${tx} ${ty}V${ty+th}H${tx+tw}V${ty}" fill="none" stroke="#ffd23f" stroke-width="2"/>`;
  const nc=Math.max(2,Math.floor((tw-8)/13));
  for(let i=0;i<nc;i++)s+=`<circle cx="${tx+10+i*13}" cy="${ty+th-7}" r="5" fill="none" stroke="#ffd23f" stroke-width="1.3"/>`;
  s+=`<circle${an} cx="${p1x}" cy="${py}" r="${r1}" fill="rgba(255,90,79,.12)" stroke="#ff5a4f" stroke-width="2"/>`;
  s+=`<circle cx="${p2x}" cy="${py}" r="${r2}" fill="rgba(255,122,217,.1)" stroke="#ff7ad9" stroke-width="2"/>`;
  s+=`<path d="M${p1x} ${py+r1}V${ceil}" stroke="#ff5a4f" stroke-width="2"/><path d="M${p1x-6} ${ceil+12}h12l-6 8z" fill="#ff5a4f"/>`;
  s+=`<rect x="-2" y="${ceil}" width="${W+4}" height="7" fill="#3a4552" stroke="#9aa6b4"/>`;
  lights.forEach(x=>{s+=`<rect x="${x-24}" y="${ceil+7}" width="48" height="6" fill="#eef2f6"/>`});
  if(!n){const X=W-28;s+=`<path d="M${X} ${slab}V${ceil}M${X-6} ${slab+6}l12-12M${X-6} ${ceil+6}l12-12" stroke="#c9d2dc" stroke-width="1.2"/><text x="${X-8}" y="${(slab+ceil)/2}" text-anchor="end">900</text>`}
  const t=(x,y,a,b,anc='start')=>`<text x="${x}" y="${y}" text-anchor="${anc}">${n?b:a}</text>`;
  s+=t(dx,dy+dh+30,'Ống gió cấp 800×400','Ống gió');
  s+=t(tx,ty+th+24,'Máng cáp 300×100','Máng cáp');
  s+=t(bx+bw+10,slab+22,'Dầm BTCT','Dầm');
  s+=t(n?W-10:p1x-r1,py+r1+24,'Ống chữa cháy D100 · thoát nước D80','Ống nước',n?'end':'start');
  s+=t(14,ceil-10,'Trần thạch cao','Trần');
  svg.innerHTML=s;animated=true;
}

function learn(el,k){

    $$('.toc button',el).forEach(b=>b.addEventListener('click',()=>go(+b.dataset.j)));
    $('select',el).addEventListener('change',e=>go(+e.target.value));
    $('#lp',el).addEventListener('click',()=>go(i-1));$('#ln',el).addEventListener('click',()=>go(i+1));

}

/* ---------- Trắc nghiệm ---------- */
function quiz(el,bank,key,count){
  let qs,i,score,done;
  const reset=()=>{qs=shuffle(bank).slice(0,count||bank.length).map(q=>({q:q[0],o:shuffle(q[1].map((t,j)=>({t,c:j===0}))),e:q[2]}));i=0;score=0;draw()};
  const draw=()=>{
    if(i>=qs.length){const pc=Math.round(score/qs.length*100);st.quiz[key]=Math.max(st.quiz[key]||0,pc);save();
      el.innerHTML=`<div class="qz"><h3 class="qq">Kết quả: ${score}/${qs.length} câu đúng (${pc}%)</h3><p class="mut">Điểm cao nhất: ${st.quiz[key]}%. ${pc>=80?'Rất tốt, có thể chuyển sang phần tiếp theo.':'Xem lại các bài liên quan rồi làm lại.'}</p><button class="btn pri" id="qa">Làm lại</button></div>`;$('#qa',el).addEventListener('click',reset);return}
    const q=qs[i];done=false;
    el.innerHTML=`<div class="qz"><div class="qhead"><span>Câu ${i+1}/${qs.length}</span><span>Đúng ${score}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><h3 class="qq">${q.q}</h3><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${'ABCD'[j]}. ${o.t}</button>`).join('')}</div><div class="qex" aria-live="polite"></div><button class="btn pri" id="qn" hidden>${i===qs.length-1?'Xem kết quả':'Câu tiếp'}</button></div>`;
    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{if(done)return;done=true;const o=q.o[+b.dataset.j];if(o.c)score++;
      $$('.opt',el).forEach((x,j)=>{if(q.o[j].c)x.classList.add('ok')});if(!o.c)b.classList.add('bad');
      const ex=$('.qex',el);ex.innerHTML=`<b class="${o.c?'ok-t':'bad-t'}">${o.c?'Chính xác.':'Chưa đúng.'}</b> ${q.e}`;const nb=$('#qn',el);nb.hidden=false;nb.focus()}));
    $('#qn',el).addEventListener('click',()=>{i++;draw()});
  };
  reset();
}

/* ---------- Luyện phím tắt ---------- */
function keyTrainer(el,list,k,title){
  el.innerHTML=`<div class="kt"><div class="kthead"><h2>${title}</h2><span class="mut" id="ks-${k}"></span></div>
  <div class="ktname" id="kn-${k}"></div>
  <form class="row" id="kf-${k}"><label class="vh" for="ki-${k}">Phím tắt</label><input class="txt" id="ki-${k}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Gõ phím tắt"><button class="btn pri">Kiểm tra</button><button type="button" class="btn" id="kx-${k}">Bỏ qua</button></form>
  <div class="ktr" id="kr-${k}" aria-live="polite"></div>
  <details><summary>Bảng phím tắt đầy đủ (${list.length})</summary>${keysTable(list.map(r=>[r[1].replace('|',' / '),r[0]]))}</details></div>`;
  let cur=null,ok=0,tot=0,streak=0,wait=false;
  const inp=$('#ki-'+k,el),res=$('#kr-'+k,el);
  const stat=()=>{$('#ks-'+k,el).textContent=`Đúng ${ok}/${tot} · chuỗi ${streak} · kỷ lục ${st.ex['k-'+k]||0}`};
  const next=()=>{let n;do{n=pick(list)}while(list.length>1&&n===cur);cur=n;$('#kn-'+k,el).textContent=cur[0];inp.value='';wait=false;stat()};
  $('#kf-'+k,el).addEventListener('submit',e=>{e.preventDefault();if(wait)return;const v=inp.value.trim().toUpperCase();if(!v)return;tot++;const ans=cur[1].split('|');
    if(ans.includes(v)){ok++;streak++;if(streak>(st.ex['k-'+k]||0)){st.ex['k-'+k]=streak;save()}res.className='ktr ok-t';res.textContent=`Đúng: ${ans.join(' hoặc ')}`;wait=true;setTimeout(next,600)}
    else{streak=0;res.className='ktr bad-t';res.textContent=`Chưa đúng. ${cur[0]} là ${ans.join(' hoặc ')}.`;wait=true;setTimeout(next,1800)}stat()});
  $('#kx-'+k,el).addEventListener('click',()=>{res.className='ktr mut';res.textContent=`${cur[0]}: ${cur[1].split('|').join(' hoặc ')}`;streak=0;next()});
  next();
}

    $$('[data-d]',el).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.d;[cur[i+1],cur[i]]=[cur[i],cur[i+1]];checked=false;draw();const f=$(`[data-d="${i+1}"]`,el)||$(`[data-u="${i+1}"]`,el);f&&f.focus()}));
    $('#om',el).addEventListener('click',load);
    $('#oc',el).addEventListener('click',()=>{checked=true;const g=cur.filter((x,i)=>x===s[i]).length;if(g===s.length){st.ex['ord'+si]=1;save()}draw();const r=$('#or',el);r.className=g===s.length?'ok-t':'';r.textContent=g===s.length?'Đúng toàn bộ trình tự.':`${g}/${s.length} bước đúng vị trí.`});

/* ---------- Bài tập M&E ---------- */
function meLab(el){
  const vals={};
  const rnd=x=>{vals[x.id]={};x.inp.forEach(p=>vals[x.id][p[0]]=pick(p[3]))};
  EX.forEach(rnd);
  const box=x=>`<div class="exh"><h3>${x.t}</h3><span class="tick">${st.ex['me-'+x.id]?'Đã giải đúng':''}</span></div><p class="mut">${x.q}</p>
   <div class="inps">${x.inp.map(p=>`<label for="${x.id}-${p[0]}"><span>${p[1]}</span><span class="iu"><input class="txt" id="${x.id}-${p[0]}" inputmode="decimal" value="${fmt(vals[x.id][p[0]],3)}">${p[2]?`<em>${p[2]}</em>`:''}</span></label>`).join('')}</div>
   <div class="row ans"><label for="a-${x.id}">Đáp số</label><input class="txt" id="a-${x.id}" inputmode="decimal" autocomplete="off"><span class="unit">${x.u}</span></div>
   <div class="row"><button class="btn pri" data-a="chk">Kiểm tra</button><button class="btn" data-a="sol">Lời giải</button><button class="btn" data-a="new">Đề mới</button></div><div class="out" aria-live="polite"></div>`;
  el.innerHTML=`<div class="exgrid">${EX.map((x,i)=>`<div class="exbox" data-i="${i}">${box(x)}</div>`).join('')}</div>`;
  el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const bx=b.closest('.exbox'),x=EX[+bx.dataset.i],out=$('.out',bx);
    if(b.dataset.a==='new'){rnd(x);bx.innerHTML=box(x);return}
    const v={};for(const p of x.inp){v[p[0]]=num($(`#${x.id}-${p[0]}`,bx).value);if(!(v[p[0]]>0)){out.innerHTML=`<span class="bad-t">Kiểm tra lại ô "${p[1]}": cần một số dương.</span>`;return}}
    if(x.id==='qc'&&(v.c1>=1||v.c2>=1||v.c2<=v.c1)){out.innerHTML='<span class="bad-t">cosφ phải nhỏ hơn 1 và cosφ mong muốn lớn hơn cosφ hiện tại.</span>';return}
    const r=x.f(v);
    if(b.dataset.a==='sol'){out.innerHTML=`<div class="sol">${x.s(v,r)}</div>`;return}
    const a=num($('#a-'+x.id,bx).value);if(isNaN(a)){out.innerHTML='<span class="bad-t">Nhập đáp số (dùng dấu phẩy hoặc dấu chấm cho phần thập phân).</span>';return}
    const good=x.int?a===r:Math.abs(a-r)<=Math.max(Math.abs(r)*(x.tol||.02),.01);
    if(good){if(!st.ex['me-'+x.id]){st.ex['me-'+x.id]=1;save();$('.tick',bx).textContent='Đã giải đúng'}out.innerHTML=`<b class="ok-t">Đúng.</b> Kết quả chính xác: ${fmt(r,3)} ${x.u}.`}
    else out.innerHTML=`<b class="bad-t">Chưa đúng.</b> ${a<r?'Đáp số của bạn nhỏ hơn':'Đáp số của bạn lớn hơn'} kết quả. Thử lại hoặc bấm Lời giải.`;
  });
}

/* ---------- Phòng vẽ AutoCAD mô phỏng ---------- */
function cadLab(el){
  el.innerHTML=`<div class="lab"><div>
    <h2>Phòng vẽ mô phỏng</h2><p class="mut" style="margin-top:8px">Gõ lệnh như AutoCAD (Enter hoặc Space để xác nhận, Esc để hủy) hoặc chạm vào màn hình để chọn điểm. Bài sẽ tự chấm khi hình khớp.</p>
    <div class="exl" id="exl"></div><div class="excard" id="exc"></div></div>
    <div class="cad"><div class="cadtool"><span>Model · Dynamic Input tắt</span><span class="row" style="gap:6px"><button class="zb" data-z="in">Phóng to</button><button class="zb" data-z="out">Thu nhỏ</button><button class="zb" data-z="ext">Toàn cảnh</button></span></div>
    <div class="cvbox"><canvas id="cv" aria-label="Vùng vẽ mô phỏng AutoCAD"></canvas></div>
    <div class="cadbar"><span id="xy">0, 0</span><span>L · C · REC · E · U · Z</span></div>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="cmdline" id="cf"><label for="cmd" id="pr">Command:</label><input id="cmd" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"></form></div></div>`;
  const cv=$('#cv',el),ctx=cv.getContext('2d'),inp=$('#cmd',el),logEl=$('#log',el),box=$('.cvbox',el);
  let ents=[],und=[],act=null,last=[0,0],lastCmd='',mouse=null,snp=null,ghost=false,ex=Math.min(st.cadEx||0,CEX.length-1),hint=false;
  let sc=2,ox=0,oy=0,W=0,H=0,dpr=1,inited=false;
  const lines=[];
  const log=s=>{lines.push(s);while(lines.length>5)lines.shift();logEl.textContent=lines.join('\n')};
  const prompt=s=>{$('#pr',el).textContent=s};
  const toS=p=>[ox+p[0]*sc,oy-p[1]*sc];
  const toW=(x,y)=>[(x-ox)/sc,(oy-y)/sc];
  const r2=v=>Math.round(v*1000)/1000;
  const fp=p=>`${fmt(r2(p[0]),2)}, ${fmt(r2(p[1]),2)}`;
  const view=(x0,y0,x1,y1)=>{sc=Math.min(W/(x1-x0),H/(y1-y0))*0.9;ox=W/2-sc*(x0+x1)/2;oy=H/2+sc*(y0+y1)/2};
  const bbox=list=>{let a=[1e9,1e9,-1e9,-1e9];const add=(x,y)=>{a=[Math.min(a[0],x),Math.min(a[1],y),Math.max(a[2],x),Math.max(a[3],y)]};
    list.forEach(e=>{if(e.t==='C'){add(e.c[0]-e.r,e.c[1]-e.r);add(e.c[0]+e.r,e.c[1]+e.r)}else{add(...e.a);add(...e.b)}});return a};
  const ext=()=>{const l=ents.concat(ghost?CEX[ex].tg:[]);if(!l.length){view(-20,-20,260,170);return}const b=bbox(l);const pad=Math.max(10,(b[2]-b[0]+b[3]-b[1])*0.08);view(b[0]-pad,b[1]-pad,Math.max(b[2],b[0]+1)+pad,Math.max(b[3],b[1]+1)+pad)};
  const zoomAt=(x,y,f)=>{const w=toW(x,y);sc*=f;ox=x-w[0]*sc;oy=y+w[1]*sc;draw()};
  const fit=()=>{dpr=window.devicePixelRatio||1;W=box.clientWidth;H=box.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(!inited&&W){view(-20,-20,260,170);inited=true}draw()};
  const ro=new ResizeObserver(fit);ro.observe(box);cleanup.push(()=>ro.disconnect());

  const keyPts=()=>{const p=[];ents.forEach(e=>{if(e.t==='L'){p.push(e.a,e.b,[(e.a[0]+e.b[0])/2,(e.a[1]+e.b[1])/2])}else if(e.t==='C'){p.push(e.c,[e.c[0]+e.r,e.c[1]],[e.c[0]-e.r,e.c[1]],[e.c[0],e.c[1]+e.r],[e.c[0],e.c[1]-e.r])}else{const[a,b]=[e.a,e.b];p.push(a,b,[a[0],b[1]],[b[0],a[1]])}});if(act&&act.n==='LINE')p.push(...act.pts);return p};
  const snap=(x,y)=>{let best=null,bd=12;for(const q of keyPts()){const s=toS(q),d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=q}}
    if(best)return{p:best,o:true};const w=toW(x,y);let g=5;while(g*sc<10)g*=2;return{p:[Math.round(w[0]/g)*g,Math.round(w[1]/g)*g],o:false}};
  const path=e=>{ctx.beginPath();if(e.t==='L'){const a=toS(e.a),b=toS(e.b);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}else if(e.t==='C'){const c=toS(e.c);ctx.arc(c[0],c[1],Math.max(e.r*sc,0.5),0,Math.PI*2)}else{const a=toS(e.a),b=toS(e.b);ctx.rect(a[0],b[1],b[0]-a[0],a[1]-b[1])}};
  const strokeE=(e,col,w,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);path(e);ctx.stroke();ctx.setLineDash([])};
  function draw(){
    if(!W)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#1a2028';ctx.fillRect(0,0,W,H);
    let g=10;while(g*sc<8)g*=5;const w0=toW(0,H),w1=toW(W,0);ctx.lineWidth=1;
    for(let x=Math.floor(w0[0]/g)*g;x<=w1[0];x+=g){const s=Math.round(ox+x*sc)+.5;ctx.strokeStyle=Math.round(x/g)%5===0?'#2a333f':'#1f262f';ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(s,H);ctx.stroke()}
    for(let y=Math.floor(w0[1]/g)*g;y<=w1[1];y+=g){const s=Math.round(oy-y*sc)+.5;ctx.strokeStyle=Math.round(y/g)%5===0?'#2a333f':'#1f262f';ctx.beginPath();ctx.moveTo(0,s);ctx.lineTo(W,s);ctx.stroke()}
    const o=toS([0,0]);ctx.lineWidth=2;ctx.strokeStyle='#d9534f';ctx.beginPath();ctx.moveTo(o[0],o[1]);ctx.lineTo(o[0]+36,o[1]);ctx.stroke();ctx.strokeStyle='#5cb85c';ctx.beginPath();ctx.moveTo(o[0],o[1]);ctx.lineTo(o[0],o[1]-36);ctx.stroke();
    if(ghost)CEX[ex].tg.forEach(e=>strokeE(e,'rgba(255,210,63,.55)',2,[8,6]));
    ents.forEach(e=>strokeE(e,'#f4f7fa',1.8));
    if(act&&mouse&&snp){const p=snp.p;let pv=null;
      if(act.n==='LINE'&&act.pts.length)pv={t:'L',a:act.pts[act.pts.length-1],b:p};
      else if(act.n==='CIRCLE'&&act.c)pv={t:'C',c:act.c,r:Math.hypot(p[0]-act.c[0],p[1]-act.c[1])};
      else if(act.n==='REC'&&act.p1)pv={t:'R',a:[Math.min(act.p1[0],p[0]),Math.min(act.p1[1],p[1])],b:[Math.max(act.p1[0],p[0]),Math.max(act.p1[1],p[1])]};
      if(pv)strokeE(pv,'#4fd1ff',1.4,[6,4])}
    if(mouse){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,mouse[1]+.5);ctx.lineTo(W,mouse[1]+.5);ctx.moveTo(mouse[0]+.5,0);ctx.lineTo(mouse[0]+.5,H);ctx.stroke();ctx.strokeRect(mouse[0]-4.5,mouse[1]-4.5,9,9);
      if(snp&&snp.o){const s=toS(snp.p);ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.strokeRect(s[0]-6,s[1]-6,12,12)}}
  }
  const near=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1])<0.6;
  const match=(t,e)=>{if(t.t!==e.t)return false;if(t.t==='L')return(near(t.a,e.a)&&near(t.b,e.b))||(near(t.a,e.b)&&near(t.b,e.a));if(t.t==='C')return near(t.c,e.c)&&Math.abs(t.r-e.r)<0.6;return near(t.a,e.a)&&near(t.b,e.b)};
  const edges=r=>{const a=r.a,b=r.b,p=[[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]];return p.map((q,i)=>({t:'L',a:q,b:p[(i+1)%4]}))};
  const has=t=>ents.some(e=>match(t,e))||(t.t==='R'&&edges(t).every(g=>ents.some(e=>match(g,e))));
  function check(){const X=CEX[ex],got=X.tg.filter(has).length,s=$('#exst',el);if(!s)return;
    if(got===X.tg.length){s.className='exst ok';s.textContent='Đạt: hình vẽ khớp đề bài.'+(ex<CEX.length-1?' Chọn bài tiếp theo ở trên.':' Bạn đã làm tới bài cuối.');if(!st.ex['cad'+ex]){st.ex['cad'+ex]=1;save();exList()}}
    else{s.className='exst';s.textContent=`Khớp ${got}/${X.tg.length} đối tượng yêu cầu.`+(ents.length&&!got?' Kiểm tra lại tọa độ đã nhập.':'')}}
  function exList(){$('#exl',el).innerHTML=CEX.map((x,i)=>`<button class="chip ${i===ex?'on':''}" data-e="${i}">${st.ex['cad'+i]?'<span class="ck">✓</span>':''}Bài ${i+1}</button>`).join('');$$('[data-e]',el).forEach(b=>b.addEventListener('click',()=>{ex=+b.dataset.e;st.cadEx=ex;save();ents=[];und=[];act=null;prompt('Command:');hint=false;exList();exCard();view(-20,-20,260,170);draw();check()}))}
  function exCard(){const X=CEX[ex];$('#exc',el).innerHTML=`<h3>${ex+1}. ${X.t}</h3><p>${X.d}</p><div class="row"><button class="btn" id="eh">${hint?'Ẩn gợi ý':'Gợi ý lệnh'}</button><button class="btn" id="eg" aria-pressed="${ghost}">${ghost?'Ẩn hình mẫu':'Hiện hình mẫu'}</button><button class="btn" id="ec">Xóa bản vẽ</button></div>${hint?`<div class="hint">${X.h.replace(/\n/g,'<br>')}</div>`:''}<div class="exst" id="exst" aria-live="polite"></div>`;
    $('#eh',el).addEventListener('click',()=>{hint=!hint;exCard();check()});$('#eg',el).addEventListener('click',()=>{ghost=!ghost;exCard();check();draw()});$('#ec',el).addEventListener('click',()=>{if(ents.length){und.push(ents.slice());ents=[]}act=null;prompt('Command:');log('ERASE ALL');exCard();check();draw()})}
  const commit=e=>{und.push(ents.slice());ents.push(e)};
  const end=()=>{act=null;prompt('Command:');draw();check()};
  const CMDS={L:'LINE',LINE:'LINE',C:'CIRCLE',CIRCLE:'CIRCLE',REC:'REC',RECTANG:'REC',RECTANGLE:'REC',E:'ERASE',ERASE:'ERASE',U:'UNDO',UNDO:'UNDO',Z:'ZOOM',ZOOM:'ZOOM'};
  function start(c){lastCmd=c;log('Command: '+c);
    if(c==='UNDO'){if(und.length){ents=und.pop();log('  Đã hoàn tác')}else log('  Không còn gì để hoàn tác');draw();check();return}
    act={n:c,pts:[]};prompt({LINE:'LINE Điểm đầu:',CIRCLE:'CIRCLE Tâm:',REC:'RECTANG Góc thứ nhất:',ERASE:'ERASE [L đối tượng cuối / ALL]:',ZOOM:'ZOOM [E toàn cảnh / I to / O nhỏ]:'}[c]);draw()}
  function commitCircle(r){if(!(r>0)){log('  Bán kính phải lớn hơn 0');return}commit({t:'C',c:act.c,r});log(`  Đường tròn tâm ${fp(act.c)}, R = ${fmt(r2(r))}`);end()}
  function feed(p){
    if(!act){log('Gõ lệnh trước khi chọn điểm, ví dụ L rồi Enter');return}
    const a=act;
    if(a.n==='LINE'){if(a.pts.length){commit({t:'L',a:a.pts[a.pts.length-1],b:p});log(`  Tới điểm ${fp(p)}`)}else log(`  Điểm đầu ${fp(p)}`);a.pts.push(p);last=p;prompt(a.pts.length>=3?'LINE Điểm tiếp [C đóng / U lùi]:':'LINE Điểm tiếp [U lùi]:');draw();check();return}
    if(a.n==='CIRCLE'){if(!a.c){a.c=p;last=p;log(`  Tâm ${fp(p)}`);prompt('CIRCLE Bán kính [D đường kính]:');draw();return}commitCircle(Math.hypot(p[0]-a.c[0],p[1]-a.c[1]));return}
    if(a.n==='REC'){if(!a.p1){a.p1=p;last=p;log(`  Góc 1 ${fp(p)}`);prompt('RECTANG Góc đối diện:');draw();return}
      if(Math.abs(p[0]-a.p1[0])<1e-9||Math.abs(p[1]-a.p1[1])<1e-9){log('  Hai góc phải khác cả x và y');return}
      commit({t:'R',a:[Math.min(a.p1[0],p[0]),Math.min(a.p1[1],p[1])],b:[Math.max(a.p1[0],p[0]),Math.max(a.p1[1],p[1])]});last=p;log(`  Góc 2 ${fp(p)}`);end();return}
    log('  Lệnh này không cần chọn điểm');
  }
  const parsePt=(s,base)=>{let m;const N='(-?\\d*\\.?\\d+)';
    if(m=s.match(new RegExp('^(@)?'+N+'<'+N+'$'))){const d=+m[2],an=+m[3]*Math.PI/180,b=m[1]?base:[0,0];return[r2(b[0]+d*Math.cos(an)),r2(b[1]+d*Math.sin(an))]}
    if(m=s.match(new RegExp('^(@)?'+N+','+N+'$'))){const b=m[1]?base:[0,0];return[r2(b[0]+ +m[2]),r2(b[1]+ +m[3])]}
    return null};
  function onText(raw){const s=raw.replace(/\s/g,'').toUpperCase();
    if(!act){if(s===''){if(lastCmd)start(lastCmd);return}const c=CMDS[s];if(!c){log(`Lệnh không xác định: "${raw.trim()}". Lệnh hỗ trợ: L, C, REC, E, U, Z`);return}start(c);return}
    const a=act;
    if(a.n==='LINE'){if(s===''){log('  Kết thúc LINE');end();return}
      if(s==='C'){if(a.pts.length>=3){commit({t:'L',a:a.pts[a.pts.length-1],b:a.pts[0]});last=a.pts[0];log('  Đóng hình');end()}else log('  Cần ít nhất 2 đoạn để đóng');return}
      if(s==='U'){if(a.pts.length>1){ents=und.pop()||ents;a.pts.pop();last=a.pts[a.pts.length-1];log('  Lùi một đoạn')}else{a.pts=[];prompt('LINE Điểm đầu:');log('  Nhập lại điểm đầu')}draw();check();return}}
    if(a.n==='CIRCLE'&&a.c){if(s==='D'){a.dia=true;prompt('CIRCLE Đường kính:');return}if(/^\d*\.?\d+$/.test(s)){commitCircle(a.dia?+s/2:+s);return}}
    if(a.n==='ERASE'){if(s==='L'||s==='LAST'){if(ents.length){und.push(ents.slice());ents.pop();log('  Đã xóa đối tượng cuối')}else log('  Bản vẽ trống')}else if(s==='ALL'){und.push(ents.slice());ents=[];log('  Đã xóa tất cả')}else if(s!==''){log('  Gõ L hoặc ALL');return}end();return}
    if(a.n==='ZOOM'){if(s===''||s==='E'||s==='A')ext();else if(s==='I')zoomAt(W/2,H/2,1.5);else if(s==='O')zoomAt(W/2,H/2,1/1.5);else{log('  Gõ E, I hoặc O');return}end();return}
    if(s===''){log('*Hủy*');end();return}
    const base=a.n==='REC'&&a.p1?a.p1:a.n==='LINE'&&a.pts.length?a.pts[a.pts.length-1]:a.n==='CIRCLE'&&a.c?a.c:last;
    const p=parsePt(s,base);if(!p){log(`  Không hiểu "${raw.trim()}". Nhập x,y  @dx,dy  hoặc @d<góc`);return}feed(p)}
  $('#cf',el).addEventListener('submit',e=>{e.preventDefault();const v=inp.value;inp.value='';onText(v);draw()});
  inp.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();const v=inp.value;inp.value='';onText(v);draw()}else if(e.key==='Escape'){if(act){act=null;prompt('Command:');log('*Hủy*');draw()}}});
  let drag=null;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.offsetX,y:e.offsetY,ox,oy,moved:false}});
  cv.addEventListener('pointermove',e=>{const x=e.offsetX,y=e.offsetY;if(drag){const dx=x-drag.x,dy=y-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(drag.moved){ox=drag.ox+dx;oy=drag.oy+dy}}
    mouse=[x,y];snp=snap(x,y);$('#xy',el).textContent=fp(snp.p)+(snp.o?'  · bắt điểm':'');draw()});
  cv.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const s=snap(e.offsetX,e.offsetY);feed(s.p);if(e.pointerType==='mouse')inp.focus()}drag=null;if(e.pointerType!=='mouse'){mouse=null;draw()}});
  cv.addEventListener('pointerleave',()=>{mouse=null;draw()});
  cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.2:1/1.2)},{passive:false});
  $$('[data-z]',el).forEach(b=>b.addEventListener('click',()=>{const z=b.dataset.z;if(z==='in')zoomAt(W/2,H/2,1.4);else if(z==='out')zoomAt(W/2,H/2,1/1.4);else{ext();draw()}}));
  log('Phòng vẽ mô phỏng AutoCAD. Đơn vị: mm.');log('Gõ L rồi Enter (hoặc Space) để bắt đầu vẽ.');
  exList();exCard();check();
}

/* ---------- Ôn tập ---------- */
function review(m){
  const DECKS=[['f','Công thức và khái niệm',FORM],['a','Phím tắt AutoCAD',CADK.map(r=>[r[0],r[1].replace('|',' / ')])],['r','Phím tắt Revit',RVTK.map(r=>[r[0],r[1].replace('|',' / ')])]];
  m.innerHTML=`<section class="band thead" style="--tc:var(--cy2)"><div class="wrap"><div class="th"><div><h1>Ôn tập</h1><p>Thẻ ghi nhớ công thức và phím tắt, cộng bài kiểm tra tổng hợp 10 câu lấy ngẫu nhiên từ cả ba môn.</p></div><div class="prog"><b>${st.quiz.mix!=null?st.quiz.mix+'%':'–'}</b><span>điểm tổng hợp cao nhất</span></div></div></div></section>
  <section class="band" style="--tc:var(--cy2)"><div class="wrap rv"><div><h2>Thẻ ghi nhớ</h2><div class="exl" id="dk"></div><div id="fc"></div></div><div><h2>Kiểm tra tổng hợp</h2><div id="mq" style="margin-top:16px"></div></div></div></section>`;
  let d=0,cards,i,flip;
  const deal=()=>{cards=shuffle(DECKS[d][2]);i=0;flip=false;draw()};
  const draw=()=>{$('#dk',m).innerHTML=DECKS.map((x,j)=>`<button class="chip ${j===d?'on':''}" data-d="${j}">${x[1]}</button>`).join('');
    $$('[data-d]',m).forEach(b=>b.addEventListener('click',()=>{d=+b.dataset.d;deal()}));
    const c=cards[i];
    $('#fc',m).innerHTML=`<button class="fc ${flip?'back':''}" id="card" aria-live="polite"><small>${flip?'Đáp án':'Thẻ '+(i+1)+'/'+cards.length+' · chạm để lật'}</small><span class="ft">${flip?c[1]:c[0]}</span></button><div class="row"><button class="btn" id="fp" ${i===0?'disabled':''}>Thẻ trước</button><button class="btn pri" id="ff">${flip?'Úp lại':'Lật thẻ'}</button><button class="btn" id="fn">${i===cards.length-1?'Xáo bộ mới':'Thẻ tiếp'}</button></div>`;
    const tog=()=>{flip=!flip;draw();$('#ff',m).focus()};
    $('#card',m).addEventListener('click',tog);$('#ff',m).addEventListener('click',tog);
    $('#fp',m).addEventListener('click',()=>{i--;flip=false;draw()});
    $('#fn',m).addEventListener('click',()=>{if(i===cards.length-1)deal();else{i++;flip=false;draw()}});
  };
  deal();
  quiz($('#mq',m),[...QZ.autocad,...QZ.revit,...QZ.me],'mix',10);
}

/* ---------- Điều hướng ---------- */
const ROUTES=['home','autocad','revit','me','on-tap'];
function route(){
  let h=location.hash.slice(1);if(!ROUTES.includes(h))h='home';
  $$('.nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));
  cleanup.forEach(f=>f());cleanup=[];
  const m=$('#app');m.refresh=null;
  if(h==='home')home(m);else if(h==='on-tap')review(m);else track(m,h);
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
